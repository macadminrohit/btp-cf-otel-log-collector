# OPT-IN overlay: send Splunk AlwaysOn Profiling data to Observability Cloud
# instead of to the HEC log index.
#
# Use case: an application running a Splunk language agent with profiling enabled
# emits CPU and memory profiles as OTLP LOG records whose instrumentation scope is
# "otel.profiling" and whose body is a gzipped, base64-encoded pprof payload. They
# arrive on the same /v1/logs endpoint as ordinary application logs and, left alone,
# are indexed in Splunk Cloud under sourcetype otel.profiling -- searchable, and
# useless, because the profiling UI never sees them.
#
# Merged on top of config.yaml by passing both files:
#   ./otelcol-contrib --config=config.yaml --config=config.profiling.yaml
# On Cloud Foundry, on its own or alongside any other overlay, in any order:
#   cf set-env <collector> OTEL_EXTRA_CONFIG config.secureapp.yaml,config.profiling.yaml
#
# The file must be in the droplet, so `cf push` the collector after adding it.
# Setting OTEL_EXTRA_CONFIG alone makes the collector reference a file that is not
# there and it will not start -- taking ordinary log delivery down with it.
#
# Required environment (cf set-env; never written to a file):
#   SPLUNK_O11Y_REALM         e.g. us0
#   SPLUNK_O11Y_ACCESS_TOKEN  org access token with ingest scope
# Both are already required by config.secureapp.yaml, so enabling profiling on a
# collector that already routes Secure Application adds no new configuration.
#
# Application side (on the app, not here):
#   SPLUNK_PROFILER_ENABLED=true
#   SPLUNK_PROFILER_MEMORY_ENABLED=true        # optional, CPU-only without it
#   SPLUNK_PROFILER_LOGS_ENDPOINT=https://<collector route>
# The endpoint is the BASE url with no path -- the agent appends /v1/logs itself.
# Unset, it falls back to OTEL_EXPORTER_OTLP_ENDPOINT and then to localhost:4318,
# which does not exist on Cloud Foundry, so profiles are silently lost. The agent
# sends Authorization from OTEL_EXPORTER_OTLP_LOGS_HEADERS, so an app already
# wired for logs needs no extra credential.
#
# WHY THIS OVERLAY ONLY ADDS, AND NEVER REDEFINES
#
# Two tempting designs are both wrong.
#
# A third row in the routing connector's table, by analogy with
# config.secureapp.yaml, destroys that overlay: config merging REPLACES sequences
# rather than appending to them, so whichever file is loaded last wins and the
# secureapp row disappears without any error. Vulnerability data would quietly
# start going to the log index.
#
# Adding the exporter to the pipeline that already carries splunk_hec has the same
# flaw in the other direction, and worse: that pipeline is named `logs/app` when
# config.secureapp.yaml is loaded and `logs` when it is not, so the overlay would
# depend on both the presence AND the load order of an unrelated file. Get it
# wrong and the collector either refuses to start or drops profiles silently.
#
# So this file declares one NEW pipeline hanging off the existing otlp receiver and
# touches nothing else. Every log record is handed to both paths, and each exporter
# keeps only its own half: the splunk_hec pair below is a mutually exclusive filter
# on the same stream, not a router. The cost is that processors run twice over the
# log stream; the benefit is an overlay that cannot break anything it does not own.

exporters:
  # Redefines only these two keys on the existing exporter; token, endpoint, index
  # and the rest are inherited from config.yaml. Without this, profiles would be
  # written to the log index as well as sent to Observability Cloud.
  splunk_hec:
    log_data_enabled: true
    profiling_data_enabled: false

  # The mirror image, pointed at Observability Cloud. Note /v1/log, singular, and
  # the signalfx.com host -- this is the ingest API, not a HEC endpoint, even
  # though the splunk_hec exporter is what speaks to it. log_data_enabled: false
  # is what makes the shared pipeline safe: ordinary and secureapp records reach
  # this exporter too, and are discarded here rather than sent to the wrong place.
  splunk_hec/profiling:
    token: ${env:SPLUNK_O11Y_ACCESS_TOKEN}
    endpoint: https://ingest.${env:SPLUNK_O11Y_REALM}.signalfx.com/v1/log
    log_data_enabled: false
    profiling_data_enabled: true
    tls:
      insecure_skip_verify: false
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

service:
  pipelines:
    # A second consumer of the same receiver. Reuses the processors defined in
    # config.yaml rather than declaring its own, so memory limits and the
    # deployment.environment mirroring stay identical on both paths.
    logs/profiling:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, batch]
      exporters: [splunk_hec/profiling]
